name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show g++ version
        run: g++ --version

      - name: Build template.cpp (release)
        run: g++ -std=gnu++20 -Wall -Wextra -O2 template.cpp -o /tmp/template

      - name: Build template.cpp (debug)
        run: g++ -std=gnu++20 -Wall -Wextra -g -DDEBUG template.cpp -o /tmp/template-debug

      - name: Build all platform sources
        run: |
          set -e
          shopt -s globstar nullglob
          fail=0
          for f in platforms/**/*.cpp; do
            echo "::group::$f"
            if ! g++ -std=gnu++20 -Wall -Wextra -O2 -I . "$f" -o /tmp/$(basename "$f" .cpp); then
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
